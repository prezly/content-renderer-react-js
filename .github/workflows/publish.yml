name: Publish Content Renderer

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate packages without publishing (does not test OIDC authentication)
        type: boolean
        required: true
        default: true
      dist_tag:
        description: npm release channel
        type: choice
        required: true
        default: latest
        options: [latest, next]

# Serialize all channels and retries. Never cancel an in-progress partial release.
concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NX_SKIP_NX_CACHE: 'true'

jobs:
  compatibility:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        react: ['18', '19']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Select React version
        env:
          REACT_VERSION: ${{ matrix.react }}
        run: pnpm react:install-version
      - run: pnpm build
      - run: pnpm test

  publish:
    needs: compatibility
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      DIST_TAG: ${{ inputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
          run_install: false
      - run: pnpm install --frozen-lockfile
      - name: Use OIDC-compatible npm
        run: |
          npm install --global npm@11.15.0 --ignore-scripts
          node --version
          npm --version
          pnpm --version
      - name: Test release safeguards
        run: node --test .github/scripts/release-checks.mjs .github/scripts/release-tag-checks.mjs
      - run: pnpm build
      - run: pnpm exec tsc --noEmit --emitDeclarationOnly false --types node,jest
      - run: pnpm check
      - name: Pack and validate consumer installation
        run: node .github/scripts/release.mjs pack "$DIST_TAG"
      - name: Ensure checks did not change committed sources
        run: git diff --exit-code
      - name: Preserve validated tarballs for release diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: npm-release-${{ github.sha }}-${{ github.run_attempt }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Check release Git tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-tag.mjs check
      - name: Publish dry run
        if: inputs.dry_run
        run: node .github/scripts/release.mjs dry-run "$DIST_TAG"
      - name: Publish committed versions
        if: ${{ !inputs.dry_run }}
        run: node .github/scripts/release.mjs publish "$DIST_TAG"
      - name: Verify registry installation
        if: ${{ !inputs.dry_run }}
        run: node .github/scripts/release.mjs verify "$DIST_TAG"
      - name: Create release Git tag
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release-tag.mjs create
